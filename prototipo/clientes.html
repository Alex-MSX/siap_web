<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes · SIAP</title>
<link rel="icon" href="assets/img/logo-prolomer.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/siap.css">
</head>
<body>
<div class="app">
  <nav id="menu" class="menu" aria-label="Menú principal"></nav>

  <div class="contenido">
    <header class="barra">
      <button id="btn-menu" class="btn icono" aria-label="Contraer menú" aria-expanded="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div class="buscador">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6676" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <label for="buscar" class="sr">Buscar cliente, RFC, grupo o póliza</label>
        <input id="buscar" type="search" placeholder="Buscar cliente, RFC, grupo o póliza…" autocomplete="off">
      </div>
      <div class="barra-der">
        <button class="btn icono" aria-label="Notificaciones">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 003.4 0"></path></svg>
        </button>
        <button class="btn primario">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Nueva orden
        </button>
        <div class="avatar" aria-label="Usuario">AM</div>
      </div>
    </header>

    <main class="pagina">
      <div class="tarjeta-cab" style="align-items: flex-end">
        <div class="pila" style="gap: 4px">
          <h1 style="font-size: 28px">Clientes</h1>
          <span id="resultado" class="sub" style="font-size: 14px"></span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <button class="btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
            Exportar
          </button>
          <button class="btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            Nuevo cliente
          </button>
        </div>
      </div>

      <!-- Contratantes + contactos -->
      <div class="fila">
        <section class="tarjeta sin-pad" style="flex: 2 1 560px; min-width: 0" aria-label="Contratantes">
          <table class="ajusta">
            <thead>
              <tr>
                <th style="width: 80px">ID</th><th>Contratante</th><th style="width: 160px">RFC</th>
                <th style="width: 160px">Ejecutivo</th><th class="der" style="width: 140px">Pólizas vigentes</th>
              </tr>
            </thead>
            <tbody id="tabla-clientes"></tbody>
          </table>
          <div id="sin-clientes" class="vacio" hidden>Sin resultados para esa búsqueda.</div>
        </section>

        <section class="tarjeta pad" style="flex: 1 1 300px; min-width: 0" aria-label="Contactos">
          <h2 style="font-size: 16px; margin-bottom: 6px">Contactos</h2>
          <div id="lista-contactos"></div>
        </section>
      </div>

      <!-- Resumen del cliente seleccionado -->
      <div class="kpis">
        <div class="tarjeta kpi"><span>Pólizas vigentes</span><strong id="k-vigentes"></strong></div>
        <div class="tarjeta kpi"><span>Prima vigente</span><strong id="k-prima"></strong></div>
        <div class="tarjeta kpi"><span>Recibos pendientes de pago</span><strong id="k-recibos"></strong></div>
        <div class="tarjeta kpi"><span>Próxima renovación</span><strong id="k-renov" class="chico"></strong><em id="k-renov-dias"></em></div>
      </div>

      <!-- Pólizas -->
      <section class="tarjeta sin-pad" style="flex: 1 1 auto; min-height: 320px" aria-label="Pólizas del cliente">
        <div class="tarjeta-cab" style="padding: 18px 22px 8px">
          <div class="pila">
            <h2 style="font-size: 16px">Pólizas</h2>
            <span class="sub"><span id="nombre-sel"></span> · <a id="liga-ficha" href="#" style="font-weight: 600; text-decoration: none">Ver ficha del cliente →</a></span>
          </div>
          <label class="switch"><input id="solo-vigentes" type="checkbox"> Solo vigentes</label>
        </div>
        <div id="pestanas" class="pestanas" role="tablist" aria-label="Ramo"></div>
        <div class="scroll-x">
          <table>
            <thead>
              <tr><th>Póliza</th><th>Aseguradora</th><th>Concepto</th><th>Ramo</th><th>Vigencia</th><th class="der">Prima</th><th>Estatus</th></tr>
            </thead>
            <tbody id="tabla-polizas"></tbody>
          </table>
        </div>
        <div id="sin-polizas" class="vacio" hidden>No hay pólizas en este ramo.</div>
      </section>
    </main>
  </div>
</div>

<script src="assets/siap.js"></script>
<script src="assets/datos-ejemplo.js"></script>
<script>
(function () {
  var esc = SIAP.esc, dinero = SIAP.dinero;
  var CLIENTES = SIAP_DATOS.clientes;
  var OTROS = ['rc', 'transporte', 'diversos'];
  var PESTANAS = [
    { k: 'todos', label: 'Todos' }, { k: 'autos', label: 'Autos' }, { k: 'gmm', label: 'GMM' },
    { k: 'accidentes', label: 'Accidentes' }, { k: 'vida', label: 'Vida' }, { k: 'hogar', label: 'Hogar' }, { k: 'otros', label: 'Otros' }
  ];
  var estado = { busqueda: 'valle', seleccionado: CLIENTES[0].id, pestana: 'todos', soloVigentes: false };

  SIAP.montarMenu('clientes');
  var inputBuscar = document.getElementById('buscar');
  inputBuscar.value = estado.busqueda;

  function enPestana(p, k) {
    if (k === 'todos') return true;
    if (k === 'otros') return OTROS.indexOf(p.cat) >= 0;
    return p.cat === k;
  }

  function filtrarClientes() {
    var q = estado.busqueda.toLowerCase().trim();
    if (!q) return CLIENTES;
    return CLIENTES.filter(function (c) {
      var texto = [c.nombre, c.rfc, c.grupo, c.id].concat(c.polizas.map(function (p) { return p.num; })).join(' ').toLowerCase();
      return texto.indexOf(q) >= 0;
    });
  }

  // soloDetalle = true: no redibuja la tabla de contratantes (solo mueve la fila marcada),
  // para que el doble clic no se pierda al seleccionar otro cliente
  function pintar(soloDetalle) {
    var lista = filtrarClientes();
    var sel = CLIENTES.filter(function (c) { return c.id === estado.seleccionado; })[0] || CLIENTES[0];
    var q = estado.busqueda.trim();
    if (soloDetalle) {
      document.querySelectorAll('#tabla-clientes tr[data-id]').forEach(function (tr) {
        tr.classList.toggle('on', Number(tr.dataset.id) === sel.id);
      });
    } else {
    document.getElementById('resultado').textContent = q
      ? lista.length + ' resultado' + (lista.length === 1 ? '' : 's') + ' para “' + q + '”'
      : 'Mostrando ' + lista.length + ' clientes';

    // Contratantes
    document.getElementById('tabla-clientes').innerHTML = lista.map(function (c) {
      var vigentes = c.polizas.filter(function (p) { return p.est !== 'off'; }).length;
      return '<tr class="clic' + (c.id === sel.id ? ' on' : '') + '" data-id="' + c.id + '" title="Doble clic para abrir la ficha">' +
        '<td class="num" style="color: var(--gris)">' + c.id + '</td>' +
        '<td class="envuelve" style="font-weight: 500">' + esc(c.nombre) + '</td>' +
        '<td class="num">' + esc(c.rfc) + '</td><td class="envuelve">' + esc(c.ejecutivo) + '</td>' +
        '<td class="der num">' + vigentes + '</td></tr>';
    }).join('');
    document.getElementById('sin-clientes').hidden = lista.length > 0;
    }

    // Contactos
    var MAX_CONTACTOS = 4;
    var resto = sel.contactos.length - MAX_CONTACTOS;
    document.getElementById('lista-contactos').innerHTML = sel.contactos.slice(0, MAX_CONTACTOS).map(function (ct) {
      var tel = ct.tels[0] ? ct.tels[0].num : '';
      return '<div class="contacto"><div class="ini">' + SIAP.iniciales(ct.nombre) + '</div><div class="pila">' +
        '<span style="font-size: 14px; font-weight: 500">' + esc(ct.nombre) + '</span>' +
        '<span class="sub">' + esc(ct.puesto) + '</span>' +
        '<span style="font-size: 13px; color: var(--texto-2)">' + esc(tel) + ' · ' + esc(ct.correos[0] || '') + '</span></div></div>';
    }).join('') + (resto > 0
      ? '<a href="ficha.html?id=' + sel.id + '" style="display: block; padding-top: 12px; border-top: 1px solid var(--linea); font-size: 14px; font-weight: 600; text-decoration: none">' +
        resto + ' contacto' + (resto === 1 ? '' : 's') + ' más en la ficha →</a>'
      : '');

    // Indicadores
    var activas = sel.polizas.filter(function (p) { return p.est !== 'off'; });
    var porRenovar = sel.polizas.filter(function (p) { return p.est === 'ren'; }).sort(function (a, b) { return a.dias - b.dias; })[0];
    document.getElementById('k-vigentes').textContent = activas.length;
    document.getElementById('k-prima').textContent = dinero(activas.reduce(function (a, p) { return a + p.prima; }, 0));
    document.getElementById('k-recibos').textContent = activas.reduce(function (a, p) { return a + p.rec; }, 0);
    document.getElementById('k-renov').textContent = porRenovar ? porRenovar.num + ' · ' + porRenovar.ramo : 'Sin renovaciones próximas';
    document.getElementById('k-renov-dias').textContent = porRenovar ? 'Vence en ' + porRenovar.dias + ' días (' + porRenovar.hasta + ')' : '';

    // Pólizas
    document.getElementById('nombre-sel').textContent = sel.nombre;
    document.getElementById('liga-ficha').href = 'ficha.html?id=' + sel.id;
    var base = sel.polizas.filter(function (p) { return !estado.soloVigentes || p.est !== 'off'; });
    document.getElementById('pestanas').innerHTML = PESTANAS.map(function (t) {
      var n = base.filter(function (p) { return enPestana(p, t.k); }).length;
      var on = t.k === estado.pestana;
      return '<button role="tab" class="tab' + (on ? ' on' : '') + '" aria-selected="' + on + '" data-k="' + t.k + '">' +
        t.label + '<span class="cuenta">' + n + '</span></button>';
    }).join('');
    var polizas = base.filter(function (p) { return enPestana(p, estado.pestana); });
    document.getElementById('tabla-polizas').innerHTML = polizas.map(function (p) {
      var est = p.est === 'vig' ? ['ok', 'Vigente'] : p.est === 'ren' ? ['warn', 'Por renovar · ' + p.dias + ' días'] : ['off', 'No vigente'];
      return '<tr class="clic" data-num="' + esc(p.num) + '" title="Doble clic para abrir la póliza"><td style="font-weight: 600; color: var(--azul)">' + esc(p.num) + '</td><td>' + esc(p.aseg) + '</td>' +
        '<td>' + esc(p.concepto) + '</td><td>' + esc(p.ramo) + '</td>' +
        '<td class="num">' + p.desde + ' – ' + p.hasta + '</td><td class="der num">' + dinero(p.prima) + '</td>' +
        '<td><span class="badge ' + est[0] + '">' + est[1] + '</span></td></tr>';
    }).join('');
    document.getElementById('sin-polizas').hidden = polizas.length > 0;
  }

  // Eventos
  inputBuscar.addEventListener('input', function () { estado.busqueda = inputBuscar.value; pintar(); });
  // Igual que en SIAP: un clic selecciona al cliente, doble clic abre su ficha
  var tablaClientes = document.getElementById('tabla-clientes');
  tablaClientes.addEventListener('click', function (e) {
    var fila = e.target.closest('tr[data-id]');
    if (!fila || Number(fila.dataset.id) === estado.seleccionado) return;
    estado.seleccionado = Number(fila.dataset.id);
    estado.pestana = 'todos';
    pintar(true);
  });
  tablaClientes.addEventListener('dblclick', function (e) {
    var fila = e.target.closest('tr[data-id]');
    if (fila) location.href = 'ficha.html?id=' + fila.dataset.id;
  });
  // Doble clic en una póliza abre su ficha
  document.getElementById('tabla-polizas').addEventListener('dblclick', function (e) {
    var fila = e.target.closest('tr[data-num]');
    if (fila) location.href = 'poliza.html?num=' + encodeURIComponent(fila.dataset.num);
  });
  document.getElementById('pestanas').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-k]');
    if (!b) return;
    estado.pestana = b.dataset.k;
    pintar();
  });
  document.getElementById('solo-vigentes').addEventListener('change', function (e) {
    estado.soloVigentes = e.target.checked;
    estado.pestana = 'todos';
    pintar();
  });

  pintar();
})();
</script>
</body>
</html>
